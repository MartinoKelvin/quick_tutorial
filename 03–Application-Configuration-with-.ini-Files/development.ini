[app:main]
use = egg:tutorial

[server:main]
use = egg:waitress#main
listen = localhost:6543

# (opsional) konfigurasi logging bisa ditambah di sini:
[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s][%(threadName)s] %(message)s
